<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FOR POR SUPPAKARN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef8ff;
      color: #183b5b;
      min-height: 100vh;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.9), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.8), transparent 25%),
        linear-gradient(180deg, #dff3ff 0%, #f8fcff 100%);
    }

    .content {
      max-width: 700px;
    }

    .logo {
      font-size: 18px;
      letter-spacing: 5px;
      font-weight: bold;
      margin-bottom: 35px;
      color: #3476a8;
    }

    .stars {
      font-size: 30px;
      letter-spacing: 12px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 80px);
      letter-spacing: 4px;
      line-height: 1.1;
      color: #1d527d;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 18px;
      letter-spacing: 2px;
      color: #668ba7;
      margin-bottom: 35px;
    }

    .welcome {
      font-size: 16px;
      line-height: 1.8;
      color: #55758c;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      border: 1px solid #7eb4d6;
      border-radius: 30px;
      color: #2d668e;
      text-decoration: none;
      background: rgba(255,255,255,0.7);
      transition: 0.3s;
    }

    .button:hover {
      background: #ffffff;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #8baabd;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <div class="logo">
        FOR POR SUPPAKARN
      </div>

      <div class="stars">
        ✦ ✧ ✦
      </div>

      <h1>
        A Sky Full of POR
      </h1>

      <div class="subtitle">
        EVERY STAR HOLDS OUR STORY
      </div>

      <p class="welcome">
        Welcome to the official fan project space<br>
        dedicated to POR SUPPAKARN.
      </p>

      <a href="#" class="button">
        ENTER THE JOURNEY ✦
      </a>

      <div class="footer">
        🤍 ❄️ ⭐️ ☁️ 🌙
      </div>

    </div>

  </section>

</body>
</html>
