<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Sky Full of POR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef8ff;
      color: #ffffff;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background-image:
        linear-gradient(
          rgba(8, 39, 68, 0.35),
          rgba(8, 39, 68, 0.55)
        ),
        url("poster.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      padding: 40px 20px;
    }

    .content {
      max-width: 850px;
      padding: 30px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 35px;
    }

    .stars {
      font-size: 30px;
      letter-spacing: 12px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 80px);
      letter-spacing: 3px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 17px;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    .welcome {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 30px;
      color: #ffffff;
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(5px);
    }

    .footer {
      margin-top: 45px;
      font-size: 13px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <div class="logo">
        FOR POR SUPPAKARN
      </div>

      <div class="stars">
        ✦ ✧ ✦
      </div>

      <h1>
        A Sky Full of POR
      </h1>

      <div class="subtitle">
        EVERY STAR HOLDS OUR STORY
      </div>

      <p class="welcome">
        From one small room<br>
        to a sky full of stars.
      </p>

      <a href="#" class="button">
        ENTER THE JOURNEY ✦
      </a>

      <div class="footer">
        🤍 ❄️ ⭐️ ☁️ 🌙
      </div>

    </div>

  </section>

</body>
</html>
